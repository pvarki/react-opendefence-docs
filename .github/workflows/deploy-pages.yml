name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Content and api-specs are committed by the sync PR flow;
      # the build needs no Outline secrets. BASE_PATH targets the GitHub
      # Pages project URL — drop it (and restore public/CNAME) when
      # docs.opendefence.fi DNS goes live.
      - name: Build
        run: pnpm build
        env:
          BASE_PATH: /react-opendefence-docs/
      # enablement: turns Pages on (build type "workflow") on first run, so
      # deploys work without a manual Settings step.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
