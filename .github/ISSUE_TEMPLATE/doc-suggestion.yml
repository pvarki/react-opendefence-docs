name: Suggest a doc edit
description: Propose a change to a page on docs.opendefence.fi. A maintainer reviews and applies it in Outline.
title: "Doc suggestion: "
labels: ["doc-suggestion"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the docs! Describe the change you'd like —
        a maintainer applies approved edits in Outline (the source of truth),
        and the next sync publishes them. No code or markup is run from this
        issue; it's just text for a human to review.
  - type: input
    id: page-url
    attributes:
      label: Page
      description: The docs.opendefence.fi URL of the page (the "Suggest an edit" link fills this in for you).
      placeholder: https://docs.opendefence.fi/en/deploy-app/...
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current wording
      description: Quote the text you want changed (optional but helps locate it).
    validations:
      required: false
  - type: textarea
    id: suggested
    attributes:
      label: Suggested change
      description: What it should say instead, and why.
    validations:
      required: true
