# >>> BEGIN AUTOGENERATED SECTION - config-ci-library
# Do not modify this section directly, instead modify the
# components in pre-commit/configs/components/ and run the
# generate script or commit to trigger regeneration
#
# Generated from:
#   - pre-commit/configs/components/common-base.pre-commit-config-component.yaml
#   - pre-commit/configs/components/common-format.pre-commit-config-component.yaml
#   - pre-commit/configs/components/typescript.pre-commit-config-component.yaml
repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        stages: [pre-commit]
      - id: check-executables-have-shebangs
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-toml
        stages: [pre-commit]
      - id: trailing-whitespace
        stages: [pre-commit]
        exclude: "^public/(content|api-specs)/"
      - id: end-of-file-fixer
        stages: [pre-commit]
        exclude: "^public/(content|api-specs)/"
      - id: check-added-large-files
        stages: [pre-commit]
        exclude: '(poetry|uv|yarn)\.lock$|package-lock\.json$|pnpm-lock\.yaml$'
        args: [--maxkb=1024]
      - id: check-case-conflict
        stages: [pre-commit]
      - id: check-symlinks
        stages: [pre-commit]
  - repo: https://github.com/Lucas-C/pre-commit-hooks-markup
    rev: v1.0.1
    hooks:
      - id: rst-linter
        stages: [pre-commit]
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: forbid-crlf
        stages: [pre-commit]
      - id: remove-crlf
        stages: [pre-commit]
      - id: forbid-tabs
        stages: [pre-commit]
        exclude: '\.go$|go\.(mod|sum)$'
      - id: remove-tabs
        stages: [pre-commit]
        exclude: '\.go$|go\.(mod|sum)$'
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.10
    hooks:
      - id: actionlint
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        exclude: "poetry.lock|pnpm-lock.yaml"
        args: [--baseline, .secrets.baseline]
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        name: Prettier
        files: \.(yml|yaml|json|md)$
        exclude: "^public/(content|api-specs)/|^src/routeTree\\.gen\\.ts$|^CHANGELOG\\.md$"
        args:
          - --tab-width=2
          - --use-tabs=false
          - --cache-location=.prettier_cache
        stages: [pre-commit]
  # >>> END AUTOGENERATED SECTION - config-ci-library
  # Add any repo-specific hooks below this line
  #
  # Local toolchain hooks (versions track package.json). The org prek CI
  # runner checks out without `pnpm install`, so each hook self-skips —
  # loudly — when node_modules is absent; in that environment the Checks
  # "quality" job enforces the same tools. On developer machines they always
  # run for real.
  - repo: local
    hooks:
      - id: prettier-ts
        name: Prettier (TypeScript / JS / CSS / HTML)
        entry: >-
          bash -c 'if [ -x node_modules/.bin/prettier ];
          then node_modules/.bin/prettier --write "$@";
          else echo "SKIPPED: node_modules missing (CI quality job enforces prettier)"; fi' --
        language: system
        types_or: [ts, tsx, javascript, jsx, css, scss, html]
        exclude: "^src/routeTree\\.gen\\.ts$"
        stages: [pre-commit]
      - id: eslint
        name: ESLint
        entry: >-
          bash -c 'if [ -x node_modules/.bin/eslint ];
          then node_modules/.bin/eslint --fix "$@";
          else echo "SKIPPED: node_modules missing (CI quality job enforces eslint)"; fi' --
        language: system
        types_or: [ts, tsx, javascript, jsx]
        exclude: "^src/routeTree\\.gen\\.ts$"
        stages: [pre-commit]
      - id: tsc
        name: TypeScript type check
        entry: >-
          bash -c 'if [ -x node_modules/.bin/tsc ];
          then node_modules/.bin/tsc -b;
          else echo "SKIPPED: node_modules missing (CI quality job enforces tsc)"; fi'
        language: system
        types_or: [ts, tsx]
        pass_filenames: false
        stages: [pre-commit]
